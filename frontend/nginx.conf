server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # One origin for the browser: the assets and the API are both served from here, so there is
    # no cross-origin request to configure and no Access-Control-Allow-Origin to get wrong.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://api:8080;
    }

    # A single-page application: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
